<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PureNAS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        transparent 50%,
        rgba(0, 0, 0, 0.03) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 100;
      animation: scanlineMove 0.1s linear infinite;
    }

    @keyframes scanlineMove {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(4px);
      }
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: center;
    }

    .purenas-text {
      font-size: 12vw;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 
        0 0 20px rgba(255, 255, 255, 0.3),
        0 0 40px rgba(255, 255, 255, 0.2);
      letter-spacing: 0.1em;
      position: relative;
      display: inline-block;
    }

    .subtitle {
      margin-top: 2rem;
      font-size: 1.5vw;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 300;
      letter-spacing: 0.3em;
      animation: fadeInOut 4s ease-in-out infinite;
      text-transform: uppercase;
    }

    @keyframes fadeInOut {
      0%, 100% {
        opacity: 0.5;
      }
      50% {
        opacity: 1;
      }
    }

    @media (max-width: 768px) {
      .purenas-text {
        font-size: 20vw;
      }
      .subtitle {
        font-size: 4vw;
      }
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="container">
    <div class="purenas-text">PureNAS</div>
    <div class="subtitle">Total Access Domination</div>
  </div>
</body>
</html>
